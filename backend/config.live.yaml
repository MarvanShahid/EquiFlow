# LIVE config: your two models on real videos / cameras.
# Edit the paths, then:  set EQUIFLOW_CONFIG=config.live.yaml   and start the backend.
mode: auto                    # falls back to simulation (and says why in /api/health) if the weights are missing
controller: adaptive          # fixed_time | adaptive

vision:
  det_weights: yolo26s.pt                                         # Model 1: COCO vehicle detector (+ ByteTrack)
  cls_weights: 'C:\Smester7\Projects\runs\cls_v4-2\weights\best.pt' # Model 2: your ambulance / other_vehicle classifier
  device: 0                   # GPU 0, or "cpu"
  imgsz: 1280                 # lower (960 / 640) if four feeds are too slow
  process_every: 1            # 2 = run the models on every second frame
  # voting rule, identical to your tracking script
  th_frame: 0.6
  m: 8
  k: 5
  mean_min: 0.65
  release: 1
  min_move: 0.0               # try 0.01 to ignore stationary objects (your test12 false events)

timing: {green_s: 15, yellow_s: 3, all_red_s: 2}
preempt: {min_green_s: 3, clear_hold_s: 4, max_preempt_s: 60, recovery_factor: 0.5, recovery_max_s: 15}
mqtt: {enabled: false, host: localhost, port: 1883, prefix: equiflow}

intersections:
  - id: J1
    name: "Main Intersection"
    lat: 33.6844
    lng: 73.0479
    sources:                  # approach -> video file | rtsp:// URL | webcam index | "sim"
      North: 'C:\Users\LEGEN\Desktop\your_project\v1.mp4'
      South: 'C:\Users\LEGEN\Desktop\your_project\v2.mp4'
      East:  'C:\Users\LEGEN\Desktop\your_project\test12.mp4'
      West:  'C:\Users\LEGEN\Desktop\your_project\test111.mp4'
